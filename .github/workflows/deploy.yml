name: Publicar no GitHub Pages

# Corre em qualquer push, mas só publica a partir do ramo principal do
# repositório — assim continua a funcionar se o ramo mudar de nome.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação de cada vez; não cancelar uma a meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Os testes são a barreira: não se publica um build com o solver ou a
      # geração de STL partidos.
      - run: npm test

      - run: npm run build

      # Requer o Pages já ligado em Definições → Pages → Source: GitHub Actions.
      # O token do workflow não tem permissão para o ligar sozinho.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
